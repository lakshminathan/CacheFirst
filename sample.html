<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/cachefirst@latest/cachefirst.min.js"></script>
</head>
<body>
    <h1>CacheFirst Demo</h1>
    <p>This page demonstrates how to use the CacheFirst library to cache and fetch various data types.</p>
    <div id="output"></div>
    <script>
        function blobtobase64(response) {
            if (response == null) return null;
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onloadend = () => {
                    if (reader.result) {
                        resolve(reader.result.split(',')[1]);
                    } else {
                        reject(new Error('Error reading blob as data URL'));
                    }
                };
                reader.readAsDataURL(response);
            });
        }

        // Fetch and cache a JS file as text
        CacheFirst.fetch("https://unpkg.com/jquery@3.3.1/dist/jquery.js").text(script => {
            eval(script);
            document.getElementById('output').innerHTML += '<b>Loaded jQuery from cache or network.</b><br>';
        });

        // Fetch and cache JSON data
        CacheFirst.fetch("https://jsonplaceholder.typicode.com/todos/1")
            .json((data, hasDataModified, fullResponse) => {
                document.getElementById('output').innerHTML += `<b>JSON Data:</b> <pre>${JSON.stringify(data, null, 2)}</pre>`;
            })
            .catch(error => {
                document.getElementById('output').innerHTML += `<b>Error fetching JSON:</b> ${error}<br>`;
            });

        // Fetch and cache Blob data (CORS-enabled image)
        CacheFirst.fetch("https://picsum.photos/150")
            .blob((data, hasDataModified) => {
                blobtobase64(data).then(str => {
                    document.getElementById('output').innerHTML += `<b>Blob Data (Base64):</b> <img src='data:image/jpeg;base64,${str}' /><br>`;
                });
            }).catch(error => {
                document.getElementById('output').innerHTML += `<b>Error fetching Blob:</b> ${error}<br>`;
            });

        // Fetch and cache plain text
        CacheFirst.fetch("https://www.w3.org/TR/PNG/iso_8859-1.txt")
            .text((data, hasDataModified) => {
                document.getElementById('output').innerHTML += `<b>Text Data:</b> <pre>${data.substring(0, 200)}...</pre>`;
            });

    </script>
</body>

</html>
